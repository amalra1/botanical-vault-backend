spring.application.name=botanical-vault-backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/botanical_vault}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:3}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION_MS:604800000}

app.admin.email=${APP_ADMIN_EMAIL:}
app.admin.password=${APP_ADMIN_PASSWORD:}
app.admin.min-password-length=1

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

storage.provider=${STORAGE_PROVIDER:local}
storage.local.directory=${STORAGE_LOCAL_DIRECTORY:./storage}
gcp.storage.bucket-name=${GCP_BUCKET_NAME:}
gcp.storage.signed-url-minutes=${GCP_SIGNED_URL_MINUTES:60}

server.port=${PORT:8080}
server.address=0.0.0.0

spring.jackson.time-zone=America/Sao_Paulo

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=100MB
